{% extends 'base.html' %}

{% block title %}Login - FlipBook{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-book-reader"></i>
            <h1>Welcome Back</h1>
            <p>Login to access your flipbooks</p>
        </div>
        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username"><i class="fas fa-user"></i> Username</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="id_password"><i class="fas fa-lock"></i> Password</label>
                {{ form.password }}
            </div>
            {% if form.errors %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i> Invalid credentials. Please try again.
            </div>
            {% endif %}
            <button type="submit" class="btn btn-login"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
    </div>
</div>
<style>
    .login-container { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px); padding: 20px; }
    .login-card { background: white; border-radius: 20px; padding: 50px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-width: 450px; width: 100%; }
    .login-header { text-align: center; margin-bottom: 40px; }
    .login-header i { font-size: 60px; color: #667eea; margin-bottom: 20px; }
    .login-header h1 { font-size: 32px; font-weight: 700; color: #333; margin-bottom: 10px; }
    .login-header p { color: #666; font-size: 16px; }
    .login-form { display: flex; flex-direction: column; gap: 25px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-weight: 600; color: #333; font-size: 14px; }
    .form-group label i { color: #667eea; margin-right: 5px; }
    .form-group input { padding: 14px 18px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; transition: all 0.3s ease; }
    .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .error-message { background: #fee2e2; color: #dc2626; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .btn-login { width: 100%; padding: 16px; font-size: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
</style>
{% endblock %}
